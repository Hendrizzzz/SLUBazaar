version: '3.8'

services:
  # ------------------------------------------------
  # 1. DATABASE SERVICE (MySQL)
  # ------------------------------------------------
  db:
    image: mysql:8.0
    container_name: slubazaar_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root # You can change this
      MYSQL_DATABASE: slubazaar
    volumes:
      # Persist data so it doesn't vanish on restart
      - db_data:/var/lib/mysql
      # Auto-import your SQL file on FIRST run only
      - ./slubazaar.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # ------------------------------------------------
  # 2. PHP CLIENT SERVICE
  # ------------------------------------------------
  client-php:
    build:
      context: ../apps/client-php
    container_name: slubazaar_php
    restart: always
    ports:
      - "80:80" # Map Server Port 80 to Container Port 80
    volumes:
      - ../apps/client-php:/var/www/html
      # SHARED UPLOADS
      - ./uploads:/var/www/html/public/uploads
    depends_on:
      - db
    networks:
      - app-network

  # ------------------------------------------------
  # 3. NODE ADMIN SERVICE
  # ------------------------------------------------
  admin-node:
    build:
      context: ../apps/admin-node
    container_name: slubazaar_node
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../apps/admin-node/.env
    environment:
      # OVERRIDE .env: In Docker, the host is the Service Name ('db')
      - DB_HOST=db
    volumes:
      - ../apps/admin-node:/usr/src/app
      - /usr/src/app/node_modules # Prevent host node_modules from breaking container
      # SHARED UPLOADS
      - ./uploads:/usr/src/app/public/uploads
    depends_on:
      - db
    networks:
      - app-network

# Define persistent storage for DB
volumes:
  db_data:

    # Define internal network so they can talk
networks:
  app-network:
    driver: bridge
