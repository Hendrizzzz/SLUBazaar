version: '3.8'

services:
  # 1. DATABASE SERVICE
  db:
    image: mysql:8.0
    container_name: slubazaar_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: slubazaar
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./312-Team-DIV-CENTERED.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. PHP CLIENT SERVICE
  client:
    build: ./apps/client-php
    container_name: slubazaar_client
    restart: always
    ports:
      - "80:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: rootpassword
      DB_NAME: slubazaar
      DB_PORT: 3306
    depends_on:
      - db
    volumes:
      - ./shared/uploads:/var/www/html/public/assets/uploads

  # 3. BACKGROUND WORKER (PHP)
  worker:
    build: ./apps/client-php
    container_name: slubazaar_worker
    restart: always
    command: php console.php auction:worker
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: rootpassword
      DB_NAME: slubazaar
      DB_PORT: 3306
    depends_on:
      - db
    volumes:
      - ./shared/uploads:/var/www/html/public/assets/uploads

  # 4. NODE.JS ADMIN SERVICE
  admin:
    build: ./apps/admin-node
    container_name: slubazaar_admin
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: rootpassword
      DB_NAME: slubazaar
      PORT: 3000
    depends_on:
      - db
    volumes:
      - ./shared/uploads:/app/public/assets/uploads

volumes:
  db_data:
